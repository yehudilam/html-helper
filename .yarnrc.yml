yarnPath: .yarn/releases/yarn-4.9.2.cjs

# Use traditional node_modules instead of PnP
nodeLinker: node-modules

# Enable zero-installs without PnP
enableGlobalCache: true

# Compression for better performance
compressionLevel: mixed

# Enable scripts for compatibility
enableScripts: true

# Network settings
httpTimeout: 60000
enableNetwork: true
